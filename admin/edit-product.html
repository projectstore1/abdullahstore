<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product - Admin</title>
    <link rel="stylesheet" href="assests/css/admin.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo">ABDULLAH STORE</div>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="categories.html" class="nav-link">Categories</a>
        <a href="products.html" class="nav-link active">Products</a>
        <a href="orders.html" class="nav-link">Orders</a>
        <a href="settings.html" class="nav-link">Settings</a>
    </div>

    <div class="main-content">
        <h1 class="page-title">Edit Product</h1>
        <div class="card">
            <input type="hidden" id="product-id">
            <div class="form-group">
                <label>Product Name</label>
                <input type="text" id="product-name">
            </div>
            <div class="form-group">
                <label>Price</label>
                <input type="number" id="product-price">
            </div>
            <div class="form-group">
                <label>Category</label>
                <select id="product-category">
                    <option value="">Select Category</option>
                </select>
            </div>
            <div class="form-group">
                <label>Image URL</label>
                <input type="text" id="product-image">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="product-description"></textarea>
            </div>
            <div class="form-group">
                <label>Stock Status</label>
                <select id="product-stock">
                    <option value="Available">Available</option>
                    <option value="Stock Out">Stock Out</option>
                </select>
            </div>
            <div class="form-group">
                <label>Unit Type</label>
                <select id="product-unit">
                    <option value="KG">KG</option>
                    <option value="Liter">Liter</option>
                    <option value="Piece">Piece</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="updateProduct()">Update Product</button>
        </div>
    </div>

    <script type="module" src="assests/js/products.js"></script>
</body>
</html>
