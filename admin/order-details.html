<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <title>Order Details - Admin</title>
    <link rel="stylesheet" href="assests/css/admin.css">
    <style>
        .card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .card h2 {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 20px;
        }
        .customer-info {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .info-item {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 15px;
        }
        .info-item p {
            font-size: 16px;
            color: #555;
            margin-bottom: 5px;
        }
        .info-item strong {
            font-size: 20px;
            color: #111;
        }
        .items-table {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .items-table h3 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 15px;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
        }
        .item-row:last-child {
            border-bottom: none;
        }
        .item-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
        }
        .item-name {
            font-size: 20px;
            font-weight: 700;
            color: #111;
        }
        .item-qty {
            font-size: 16px;
            color: #555;
        }
        .item-price {
            font-size: 24px;
            font-weight: 900;
            color: #ff7f11;
        }
        .summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }
        .summary-item {
            font-size: 18px;
        }
        .summary-item strong {
            font-size: 24px;
            font-weight: 900;
            color: #16a34a;
        }
        .location-btn {
            background: #16a34a;
            color: white;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 800;
            text-decoration: none;
            display: inline-block;
            transition: 0.3s;
        }
        .location-btn:hover {
            background: #00a8cc;
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0, 168, 204, 0.3);
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo">ABDULLAH STORE</div>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="categories.html" class="nav-link">Categories</a>
        <a href="products.html" class="nav-link">Products</a>
        <a href="orders.html" class="nav-link active">Orders</a>
        <a href="settings.html" class="nav-link">Settings</a>
    </div>

    <div class="main-content">
        <h1 class="page-title">Order Details</h1>
        <div id="order-details-container"></div>
    </div>

    <script type="module" src="assests/js/order-details.js"></script>
</body>
</html>
