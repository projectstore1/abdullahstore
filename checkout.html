<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=600">
    <title>Checkout - Abdullah Store</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="header">
        <div class="logo" onclick="location.href='index.html'">ABDULLAH STORE</div>
    </header>

    <div class="container">
        <div class="section-title">Order Summary</div>
        <div style="background:var(--card); padding:20px; border-radius:15px; margin-bottom:20px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <span>Subtotal:</span>
                <span id="total" style="color:var(--secondary);">৳ 0</span>
            </div>
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <span>Delivery Fee:</span>
                <span>৳ 30</span>
            </div>
        </div>

        <div class="section-title">Payment Method</div>
        <div class="payment-method" id="pay-cash" onclick="selectPayment('cash')">💵 Cash Payment</div>
        <div class="payment-method" id="pay-bkash" onclick="selectPayment('bkash')">📱 Bangla QR Pay</div>

        <div class="section-title" style="margin-top:20px;">Customer Information</div>
        <div style="background:var(--card); padding:20px; border-radius:15px;">
            <input type="text" id="customer-name" placeholder="Your Name" style="width:100%; padding:12px; margin-bottom:10px; border:1px solid #E5E7EB; border-radius:8px;">
            <input type="text" id="customer-phone" placeholder="Phone" style="width:100%; padding:12px; margin-bottom:10px; border:1px solid #E5E7EB; border-radius:8px;">
            <textarea id="customer-address" placeholder="Address" style="width:100%; padding:12px; margin-bottom:10px; border:1px solid #E5E7EB; border-radius:8px;"></textarea>
        </div>

        <button class="btn-primary" style="margin-top:20px;" onclick="placeOrder()">Place Order</button>
    </div>

    <footer class="footer">
        Developed by Abdullah Khan
    </footer>

    <script type="module" src="assets/js/checkout.js"></script>
</body>
</html>
