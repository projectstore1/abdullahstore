<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Abdullah Store</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .thanks-box {
            text-align: center;
            padding: 60px 20px;
            background: var(--card);
            border-radius: 20px;
            margin-top: 50px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        .icon { font-size: 80px; color: var(--primary); }
        h1 { color: var(--text); margin: 20px 0; }
        .brand { color: var(--primary); font-weight: 900; font-size: 24px; }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">ABDULLAH STORE</div>
    </header>

    <div class="container">
        <div class="thanks-box">
            <div class="icon">✔</div>
            <h1>Order Successful</h1>
            <h3>Thanks For Ordering</h3>
            <p style="margin-top:20px;">Via</p>
            <div class="brand">ABDULLAH STORE</div>
            <p style="margin-top:20px;">আপনার অর্ডার গ্রহণ করা হয়েছে।<br>আপনার পণ্য কিছুক্ষণের মধ্যে পৌঁছে যাবে।</p>
            
            <button class="btn-primary" style="margin-top:30px; max-width:300px; margin-left:auto; margin-right:auto;" onclick="location.href='index.html'">Back To Home</button>
        </div>
    </div>

    <footer class="footer">
        Developed by Abdullah Khan
    </footer>
</body>
</html>
