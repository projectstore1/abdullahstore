<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <title>Checkout - Abdullah Store</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* Big Input Boxes */
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-weight: 800;
            font-size: 18px;
            margin-bottom: 8px;
            color: var(--text-black);
        }
        
        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 18px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: var(--bg-input);
            color: var(--text-black);
            font-size: 18px;
            transition: 0.3s;
        }
        
        .form-group input:focus, 
        .form-group textarea:focus {
            outline: none;
            border-color: var(--deep-cyan);
            box-shadow: 0 0 0 3px rgba(0, 168, 204, 0.1);
        }
        
        /* Location Box (Readonly) */
        .location-box {
            width: 100%;
            padding: 18px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: #f9fafb;
            color: #555;
            font-size: 18px;
            cursor: not-allowed;
            opacity: 0.8;
            margin-bottom: 10px;
        }
        
        .location-box:focus {
            outline: none;
            border-color: var(--border-color);
        }
        
        /* Add Location Button */
        .add-location-btn {
            background: var(--deep-green);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 800;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 15px;
            transition: 0.3s;
        }
        
        .add-location-btn:hover {
            background: var(--deep-cyan);
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0, 168, 204, 0.3);
        }
        
        /* Popup Message */
        .popup-message {
            display: none;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }
        
        .popup-success {
            background: #f0fdf4;
            border: 1px solid #dcfce7;
            color: #16a34a;
        }
        
        .popup-error {
            background: #fef2f2;
            border: 1px solid #fee2e2;
            color: #dc2626;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo" onclick="location.href='index.html'">ABDULLAH STORE</div>
    </header>

    <div class="container">
        <!-- Order Summary: সব প্রোডাক্ট দেখা যাবে -->
        <div class="section-title">Order Summary</div>
        <div id="order-items" style="background:var(--card); padding:20px; border-radius:15px; margin-bottom:20px;">
            <!-- JavaScript থেকে প্রোডাক্ট লিস্ট আসবে -->
        </div>

        <div style="background:var(--card); padding:20px; border-radius:15px; margin-bottom:20px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <span>Subtotal:</span>
                <span id="subtotal" style="color:var(--deep-orange); font-weight:bold;">৳ 0</span>
            </div>
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <span>Delivery Fee:</span>
                <span id="delivery-fee" style="color:var(--text-black);">৳ 30</span>
            </div>
            <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:18px; border-top:1px solid #ddd; padding-top:10px;">
                <span>Total:</span>
                <span id="total" style="color:var(--deep-orange); font-weight:900; font-size:24px;">৳ 0</span>
            </div>
        </div>

        <!-- Payment Method -->
        <div class="section-title">Payment Method</div>
        <div class="payment-method" id="pay-cash" onclick="selectPayment('cash')">
            <span style="font-size:24px;">💵</span> Cash Payment
        </div>
        <div class="payment-method" id="pay-bkash" onclick="selectPayment('bkash')">
            <span style="font-size:24px;">📱</span> Bangla QR Pay MFS
        </div>

        <!-- Customer Information -->
        <div class="section-title" style="margin-top:20px;">Customer Information</div>
        <div style="background:var(--card); padding:25px; border-radius:15px;">
            
            <div class="form-group">
                <label for="customer-name">আপনার নাম</label>
                <input type="text" id="customer-name" placeholder="আপনার নাম লিখুন">
            </div>
            
            <div class="form-group">
                <label for="customer-phone">মোবাইল নম্বর</label>
                <input type="text" id="customer-phone" placeholder="01XXXXXXXXX">
            </div>
            
            <div class="form-group">
                <label>আপনার লোকেশন</label>
                <!-- Location Box (Readonly) -->
                <input type="text" id="customer-location" class="location-box" readonly placeholder="📍 Add Location বাটনে ক্লিক করুন">
            </div>
            
            <!-- Add Location Button -->
            <button class="add-location-btn" onclick="getLocation()">📍 Add Location</button>
            
            <!-- Popup Message -->
            <div id="location-popup" class="popup-message"></div>
        </div>

        <button class="btn-primary" style="margin-top:20px; font-size:20px; padding:20px;" onclick="placeOrder()">Place Order</button>
    </div>

    <footer class="footer">
        <strong>Developed by Abdullah Khan</strong>
    </footer>

    <script type="module" src="assets/js/checkout.js"></script>
</body>
</html>
