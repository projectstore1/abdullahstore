<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <title>Abdullah Store</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .banner-slider {
            width: 100%;
            height: 500px;
            overflow: hidden;
            border-radius: 10px;
            position: relative;
            margin-bottom: 20px;
        }
        .banner-slider img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .banner-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">ABDULLAH STORE</div>
        
        <!-- 🔍 লম্বা Search Box (Logo আর Cart এর মাঝে) -->
        <div class="search-box">
            <input type="text" id="search-input" placeholder="পণ্য খুঁজুন..." oninput="searchProducts()">
        </div>

        <a href="my-list.html" class="cart-btn">🛒 My List</a>
    </header>

    <div class="container">
        <div class="banner-slider">
            <img id="banner-image" src="https://www.image2url.com/r2/default/images/1787768197849-82301a68-b1d3-4023-8d55-63cabfb85a66.png" alt="Banner">
            <div class="banner-text" id="banner-text"></div>
        </div>
    </div>

    <div class="container">
        <div class="section-title">Categories</div>
        <div class="categories" id="categories-container"></div>
    </div>

    <div class="container">
        <div class="section-title">All Products</div>
        <div class="product-grid" id="products-container"></div>
    </div>

    <footer class="footer">
        Developed by Abdullah Khan
    </footer>

    <!-- Home JS -->
    <script type="module" src="assets/js/home.js"></script>
</body>
</html>
