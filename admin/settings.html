<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Admin</title>
    <link rel="stylesheet" href="assests/css/admin.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo">ABDULLAH STORE</div>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="categories.html" class="nav-link">Categories</a>
        <a href="products.html" class="nav-link">Products</a>
        <a href="orders.html" class="nav-link">Orders</a>
        <a href="settings.html" class="nav-link active">Settings</a>
    </div>

    <div class="main-content">
        <h1 class="page-title">Settings</h1>
        <div class="card">
            <div class="form-group">
                <label>Store Name</label>
                <input type="text" id="store-name">
            </div>
            <div class="form-group">
                <label>Banner Image URL</label>
                <input type="text" id="banner-image" placeholder="https://example.com/banner.jpg">
            </div>
            <div class="form-group">
                <label>Banner Text</label>
                <input type="text" id="banner-text" placeholder="বিশ্বস্ত মানের নিত্যপ্রয়োজনীয় পণ্য">
            </div>
            <div class="form-group">
                <label>Delivery Fee</label>
                <input type="number" id="delivery-fee" placeholder="30">
            </div>
            <div class="form-group">
                <label>Bangla QR Image URL</label>
                <input type="text" id="qr-image" placeholder="https://example.com/qr.jpg">
            </div>
            <button class="btn btn-primary" onclick="saveSettings()">Save</button>
        </div>
    </div>

    <script type="module" src="assests/js/settings.js"></script>
</body>
</html>
